<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hermes Terminal</title>

    <link rel="stylesheet" href="./vendor/xterm.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #050505;
        }

        #terminal {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            background: #050505;
        }

        #composer {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid #22262d;
            background: #0b0d10;
            box-sizing: border-box;
        }

        #messageInput {
            height: 38px;
            min-height: 38px;
            max-height: 38px;
            resize: none;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 9px 10px;
            background: #050505;
            color: #e6edf3;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.35;
            outline: none;
            box-sizing: border-box;
        }

        #messageInput:focus {
            border-color: #4f8cff;
        }

        #attachButton,
        #stopButton,
        #sendButton {
            height: 38px;
            min-width: 42px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #161b22;
            color: #e6edf3;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton {
            min-width: 72px;
            background: #1f6feb;
            border-color: #388bfd;
            font-size: 13px;
            font-weight: 600;
        }

        #attachButton:hover,
        #stopButton:hover,
        #sendButton:hover {
            filter: brightness(1.12);
        }

        #ragStatus {
            grid-column: 1 / 5;
            min-height: 16px;
            color: #8b949e;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #status {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #50fa7b;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            z-index: 10;
            white-space: pre-wrap;
        }

        .xterm {
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .xterm-viewport {
            background-color: #050505 !important;
        }

        .xterm-screen {
            background-color: #050505 !important;
        }
    </style>
</head>

<body>
    <div id="status">Loading terminal...</div>
    <div id="app">
        <div id="terminal"></div>
        <div id="composer">
            <button id="attachButton" title="Attach files for RAG">+</button>
            <textarea id="messageInput" placeholder="Message Hermes..."></textarea>
            <button id="stopButton" title="Send Ctrl+C to Hermes">Stop</button>
            <button id="sendButton">Send</button>
            <div id="ragStatus">Attach files to index them for RAG. Enter sends, Shift+Enter adds a line.</div>
            <input id="fileInput" type="file" multiple hidden>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>

    <script>
        const statusBox = document.getElementById("status");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const stopButton = document.getElementById("stopButton");
        const attachButton = document.getElementById("attachButton");
        const fileInput = document.getElementById("fileInput");
        const ragStatus = document.getElementById("ragStatus");

        function setStatus(text, color = "#50fa7b") {
            statusBox.style.display = "block";
            statusBox.innerText = text;
            statusBox.style.color = color;
        }

        window.onerror = function(message, source, lineno, colno, error) {
            setStatus(
                "JavaScript error:\n" +
                message + "\nLine: " + lineno + ":" + colno,
                "#ff5555"
            );
        };

        if (typeof Terminal === "undefined") {
            setStatus("ERROR: xterm.js failed to load.", "#ff5555");
        } else {
            const term = new Terminal({
                cursorBlink: true,
                cursorStyle: "block",
                fontFamily: "Menlo, Monaco, Consolas, monospace",
                fontSize: 14,
                lineHeight: 1.15,
                convertEol: false,
                scrollback: 5000,
                theme: {
                    background: "#050505",
                    foreground: "#e6edf3",
                    cursor: "#ffffff",
                    selectionBackground: "#264f78"
                }
            });

            let fitAddon = null;

            if (typeof FitAddon !== "undefined") {
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
            }

            term.open(document.getElementById("terminal"));

            if (fitAddon) {
                fitAddon.fit();
            }

            term.focus();
            statusBox.style.display = "none";

            let pyBackend = null;

            function fitAndNotify() {
                if (fitAddon) {
                    fitAddon.fit();
                }

                if (pyBackend) {
                    pyBackend.resize_pty(term.cols, term.rows);
                }
            }

            new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBackend = channel.objects.terminalBackend;

    term.writeln("Connecting to Hermes...");
    term.writeln("");

    if (pyBackend.rag_status_received) {
        pyBackend.rag_status_received.connect(function(text) {
            window.setRagStatus(text);
        });
    }

    fitAndNotify();

    // Start Hermes only after xterm and QWebChannel are ready.
    pyBackend.start_process();
    messageInput.focus();
});

            window.terminalOutputBuffer = [];

window.writeToTerminal = function(text) {
    if (text) {
        window.terminalOutputBuffer.push(text);
    }
};

window.flushTerminalOutput = function() {
    if (!window.terminalOutputBuffer || window.terminalOutputBuffer.length === 0) {
        return;
    }

    const text = window.terminalOutputBuffer.join("");
    window.terminalOutputBuffer = [];

    term.write(text);
};

window.forceTerminalRefresh = function() {
    try {
        if (window.flushTerminalOutput) {
            window.flushTerminalOutput();
        }
    } catch (e) {
        console.log("forceTerminalRefresh failed:", e);
    }
};

setInterval(function() {
    window.flushTerminalOutput();
}, 30);
            window.forceTerminalRefresh = function() {
    try {
        term.refresh(0, term.rows - 1);
    } catch (e) {
        console.log("forceTerminalRefresh failed:", e);
    }
};
            window.clearTerminal = function() {
                term.clear();
            };

            window.setRagStatus = function(text) {
                ragStatus.innerText = text || "";
            };

            function sendComposerMessage() {
                const message = messageInput.value.trim();
                if (!message || !pyBackend) {
                    return;
                }

                term.writeln("");
                term.writeln("> " + message.replace(/\n/g, "\n> "));
                messageInput.value = "";
                window.setRagStatus("Preparing message...");
                pyBackend.submit_chat_message(message);
            }

            sendButton.addEventListener("click", function() {
                sendComposerMessage();
            });

            stopButton.addEventListener("click", function() {
                if (pyBackend) {
                    pyBackend.write_input("\x03");
                    window.setRagStatus("Sent interrupt.");
                }
            });

            messageInput.addEventListener("keydown", function(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendComposerMessage();
                }
            });

            attachButton.addEventListener("click", function() {
                fileInput.click();
            });

            fileInput.addEventListener("change", function() {
                if (!pyBackend || !fileInput.files || fileInput.files.length === 0) {
                    return;
                }

                Array.from(fileInput.files).forEach(function(file) {
                    if (file.size > 2 * 1024 * 1024) {
                        window.setRagStatus(file.name + " is larger than 2 MB. Skipped.");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function() {
                        const dataUrl = String(reader.result || "");
                        window.setRagStatus("Sending " + file.name + " for indexing...");
                        pyBackend.attach_file_data(file.name, dataUrl);
                    };
                    reader.onerror = function() {
                        window.setRagStatus("Could not read " + file.name + ".");
                    };
                    reader.readAsDataURL(file);
                });

                fileInput.value = "";
            });

            window.addEventListener("resize", function() {
                fitAndNotify();
            });

            document.body.addEventListener("click", function() {
                messageInput.focus();
            });
        }
    </script>
</body>
</html>
